name: CI

on:
  push:
    branches: [master]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: go-server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go-server/go.mod
          cache-dependency-path: go-server/go.sum
      # The UI is embedded with go:embed; tests do not need a real build.
      - name: Placeholder UI build
        run: mkdir -p frontend/dist && touch frontend/dist/.keep
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: go-server/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: go-server/frontend/package-lock.json
      - run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        laravel: ["^12.0", "^13.0"]
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
      - name: Unit tests
        working-directory: laravel-package
        run: composer update --no-interaction --no-progress && vendor/bin/phpunit
      - name: Laravel ${{ matrix.laravel }} compatibility tests
        working-directory: tests/compatibility
        run: |
          composer require --no-interaction --no-progress -W --dev "laravel/framework:${{ matrix.laravel }}"
          vendor/bin/phpunit
