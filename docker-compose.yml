name: wiretap

services:
  # === Core ===

  wiretap:
    container_name: wiretap-go
    build:
      context: ./go-server
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
      - "9090:9090"
      - "1025:1025"
    volumes:
      - ./go-server:/app
      - wiretap-go-mod:/go/pkg/mod
      - wiretap-go-build:/root/.cache/go-build
      - wiretap-data:/data
    environment:
      - WIRETAP_STORAGE_PATH=/data/wiretap.duckdb
      - WIRETAP_WEB_PORT=8080
      - WIRETAP_INGEST_PORT=9090
      - WIRETAP_SMTP_PORT=1025
      - WIRETAP_PASSWORD=${WIRETAP_PASSWORD:-}
      - WIRETAP_INGEST_KEY=${WIRETAP_INGEST_KEY:-}
      - WIRETAP_APP_URL=http://laravel-12:8000
      - WIRETAP_REPLAY_SECRET=${WIRETAP_REPLAY_SECRET:-}
      - WIRETAP_REDIS_ADDR=redis:6379
    networks:
      - wiretap-net

  frontend:
    container_name: wiretap-frontend
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./go-server/frontend:/app
      - wiretap-node-modules:/app/node_modules
    depends_on:
      - wiretap
    networks:
      - wiretap-net

  # === Infrastructure ===

  mysql:
    container_name: wiretap-mysql
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - wiretap-mysql:/var/lib/mysql
      - ./test-apps/init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - wiretap-net

  redis:
    container_name: wiretap-redis
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - wiretap-net

  # === Laravel 12 ===

  laravel-12:
    container_name: wiretap-laravel-12
    build:
      context: ./test-apps/laravel-12
      dockerfile: Dockerfile
    ports:
      - "8012:8000"
    volumes:
      - ./test-apps/laravel-12:/var/www/html
      - ./laravel-package:/var/www/packages/wiretap
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_DATABASE=laravel12
      - DB_USERNAME=root
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_DB=2
      - CACHE_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - MAIL_MAILER=smtp
      - MAIL_HOST=wiretap-go
      - MAIL_PORT=1025
      - MAIL_ENCRYPTION=null
      - WIRETAP_ENABLED=true
      - WIRETAP_DRIVER=${WIRETAP_DRIVER:-http}
      - WIRETAP_URL=http://wiretap-go:9090/ingest
      - BROADCAST_DRIVER=redis
    depends_on:
      - mysql
      - redis
      - wiretap
    networks:
      - wiretap-net

  worker-12:
    container_name: wiretap-worker-12
    build:
      context: ./test-apps/laravel-12
      dockerfile: Dockerfile
    command: php artisan queue:work redis --tries=3
    volumes:
      - ./test-apps/laravel-12:/var/www/html
      - ./laravel-package:/var/www/packages/wiretap
    environment:
      - APP_ENV=local
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_DATABASE=laravel12
      - DB_USERNAME=root
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_DB=2
      - QUEUE_CONNECTION=redis
      - WIRETAP_ENABLED=true
      - WIRETAP_DRIVER=${WIRETAP_DRIVER:-http}
      - WIRETAP_URL=http://wiretap-go:9090/ingest
    depends_on:
      - mysql
      - redis
      - wiretap
    networks:
      - wiretap-net

  scheduler-12:
    container_name: wiretap-scheduler-12
    build:
      context: ./test-apps/laravel-12
      dockerfile: Dockerfile
    command: bash -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    volumes:
      - ./test-apps/laravel-12:/var/www/html
      - ./laravel-package:/var/www/packages/wiretap
    environment:
      - APP_ENV=local
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_DATABASE=laravel12
      - DB_USERNAME=root
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_DB=2
      - QUEUE_CONNECTION=redis
      - WIRETAP_ENABLED=true
      - WIRETAP_DRIVER=${WIRETAP_DRIVER:-http}
      - WIRETAP_URL=http://wiretap-go:9090/ingest
    depends_on:
      - mysql
      - redis
      - wiretap
    networks:
      - wiretap-net

  # === Laravel 13 ===

  laravel-13:
    container_name: wiretap-laravel-13
    build:
      context: ./test-apps/laravel-13
      dockerfile: Dockerfile
    ports:
      - "8013:8000"
    volumes:
      - ./test-apps/laravel-13:/var/www/html
      - ./laravel-package:/var/www/packages/wiretap
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_DATABASE=laravel13
      - DB_USERNAME=root
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_DB=3
      - CACHE_DRIVER=redis
      - QUEUE_CONNECTION=redis
      - MAIL_MAILER=smtp
      - MAIL_HOST=wiretap-go
      - MAIL_PORT=1025
      - MAIL_ENCRYPTION=null
      - WIRETAP_ENABLED=true
      - WIRETAP_DRIVER=${WIRETAP_DRIVER:-http}
      - WIRETAP_URL=http://wiretap-go:9090/ingest
      - BROADCAST_DRIVER=redis
    depends_on:
      - mysql
      - redis
      - wiretap
    networks:
      - wiretap-net

  worker-13:
    container_name: wiretap-worker-13
    build:
      context: ./test-apps/laravel-13
      dockerfile: Dockerfile
    command: php artisan queue:work redis --tries=3
    volumes:
      - ./test-apps/laravel-13:/var/www/html
      - ./laravel-package:/var/www/packages/wiretap
    environment:
      - APP_ENV=local
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_DATABASE=laravel13
      - DB_USERNAME=root
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_DB=3
      - QUEUE_CONNECTION=redis
      - WIRETAP_ENABLED=true
      - WIRETAP_DRIVER=${WIRETAP_DRIVER:-http}
      - WIRETAP_URL=http://wiretap-go:9090/ingest
    depends_on:
      - mysql
      - redis
      - wiretap
    networks:
      - wiretap-net

  scheduler-13:
    container_name: wiretap-scheduler-13
    build:
      context: ./test-apps/laravel-13
      dockerfile: Dockerfile
    command: bash -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    volumes:
      - ./test-apps/laravel-13:/var/www/html
      - ./laravel-package:/var/www/packages/wiretap
    environment:
      - APP_ENV=local
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_DATABASE=laravel13
      - DB_USERNAME=root
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_DB=3
      - QUEUE_CONNECTION=redis
      - WIRETAP_ENABLED=true
      - WIRETAP_DRIVER=${WIRETAP_DRIVER:-http}
      - WIRETAP_URL=http://wiretap-go:9090/ingest
    depends_on:
      - mysql
      - redis
      - wiretap
    networks:
      - wiretap-net

networks:
  wiretap-net:
    name: wiretap-net

volumes:
  wiretap-mysql:
    name: wiretap-mysql
  wiretap-data:
    name: wiretap-data
  wiretap-go-mod:
    name: wiretap-go-mod
  wiretap-go-build:
    name: wiretap-go-build
  wiretap-node-modules:
    name: wiretap-node-modules
