root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/wiretap ./cmd/wiretap/"
  full_bin = "./tmp/wiretap"
  delay = 1000
  exclude_dir = ["tmp", "frontend", "vendor"]
  exclude_regex = ["_test.go"]
  include_ext = ["go", "toml", "yml"]
  kill_delay = 500

[log]
  time = false

[misc]
  clean_on_exit = true
